name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 3"
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
  workflow_dispatch:

env:
  GOTOOLCHAIN: local

permissions:
  contents: read
  pull-requests: read

# Group PR runs together; keep main, manual and release runs independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Lint web
        run: npm --prefix web run lint

      - name: Web unit tests with coverage
        run: |
          mkdir -p web/coverage
          node --experimental-strip-types --test --experimental-test-coverage \
            --test-reporter=lcov --test-reporter-destination=web/coverage/lcov.info \
            --test-reporter=spec --test-reporter-destination=stdout \
            web/packages/ui/tests/*.test.mjs

      # prebuild runs lint and unit tests; both already ran above with coverage.
      - name: Typecheck and build web assets
        run: |
          npm --prefix web --ignore-scripts run build
          make check-web

      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload web unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web-unit
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  web-tests:
    name: web-tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Web component tests with coverage
        run: npm --prefix web run test:dom -- --coverage --shard=${{ matrix.shard }}/2

      - name: Upload web component coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web-dom-${{ matrix.shard }}
          path: web/coverage/dom/lcov.info
          if-no-files-found: error
          retention-days: 1

  build:
    name: build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist

      - name: Check web assets
        run: make check-web

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

  test-race:
    name: test-race
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist

      - name: Check web assets
        run: make check-web

      - name: Test with race detector and coverage
        run: go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        shell: bash
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '$1 == "total:" {gsub("%", "", $3); print $3}')"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 85) { printf "coverage %.1f%% is below 85%%\n", coverage; exit 1 } }'

      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

  sonarcloud:
    name: SonarCloud quality gate
    # Release tags repeat tests and bundle verification; Sonar runs on PRs/main.
    if: github.ref_type != 'tag'
    needs: [web, web-tests, test-race]
    runs-on: ubuntu-latest
    steps:
      - name: Require Sonar credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if test -z "$SONAR_TOKEN"; then
            echo "::error::SONAR_TOKEN is required. Fork PRs need a maintainer-reviewed branch in this repository for the Sonar check."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Go coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-go

      - name: Download web coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-web-*
          path: web/coverage

      - name: Require complete coverage reports
        run: |
          test -s coverage.out
          test -s web/coverage/coverage-web-unit/lcov.info
          test -s web/coverage/coverage-web-dom-1/lcov.info
          test -s web/coverage/coverage-web-dom-2/lcov.info

      - name: Run SonarCloud scan and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.javascript.lcov.reportPaths=web/coverage/coverage-web-unit/lcov.info,web/coverage/coverage-web-dom-1/lcov.info,web/coverage/coverage-web-dom-2/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          test -z "${unformatted}" || { printf 'The following files are not gofmt-clean:\n%s\n' "${unformatted}"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          install-mode: goinstall
          args: ./...
