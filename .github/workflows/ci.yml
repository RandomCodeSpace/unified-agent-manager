name: CI

# One workflow for pull requests, main, the weekly schedule and release
# fallbacks. The web bundle is built once and shared by every Go job.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 3"
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
  workflow_dispatch:

env:
  GOTOOLCHAIN: local

permissions:
  contents: read
  pull-requests: read

# Group PR runs together; keep main, manual and release runs independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      # prebuild runs lint and unit tests; web-tests shard 1 runs both with coverage.
      - name: Typecheck and build web assets
        run: |
          npm --prefix web --ignore-scripts run build
          make check-web

      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist
          if-no-files-found: error
          retention-days: 1

  web-tests:
    name: web-tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      # Shard 1 also lints and runs the unit tests, which evens out the two shards.
      - name: Lint web
        if: matrix.shard == 1
        run: npm --prefix web run lint

      - name: Web unit tests with coverage
        if: matrix.shard == 1
        run: |
          mkdir -p web/coverage
          node --experimental-strip-types --test --experimental-test-coverage \
            --test-reporter=lcov --test-reporter-destination=web/coverage/lcov.info \
            --test-reporter=spec --test-reporter-destination=stdout \
            web/packages/ui/tests/*.test.mjs

      - name: Upload web unit coverage
        if: matrix.shard == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web-unit
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Web component tests with coverage
        run: npm --prefix web run test:dom -- --coverage --shard=${{ matrix.shard }}/2

      - name: Upload web component coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web-dom-${{ matrix.shard }}
          path: web/coverage/dom/lcov.info
          if-no-files-found: error
          retention-days: 1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # gofmt, goimports, govet and staticcheck run inside golangci-lint (.golangci.yml).
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          install-mode: goinstall
          args: ./...

  # Race detection only: coverage comes from the uninstrumented run below,
  # which finishes well before this one and lets Sonar start earlier.
  test-race:
    name: test-race
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist

      - name: Test with race detector
        run: go test -race -count=1 ./...

  coverage:
    name: coverage
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist

      - name: Test with coverage
        run: go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        shell: bash
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '$1 == "total:" {gsub("%", "", $3); print $3}')"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 85) { printf "coverage %.1f%% is below 85%%\n", coverage; exit 1 } }'

      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

  sonarcloud:
    name: SonarCloud quality gate
    # Release tags reuse their source commit's result; Sonar runs on PRs/main.
    # It also runs when an input failed, so the required check fails with it.
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    needs: [web-tests, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require passing tests and coverage
        if: needs.web-tests.result != 'success' || needs.coverage.result != 'success'
        run: |
          echo "::error::web-tests: ${{ needs.web-tests.result }}, coverage: ${{ needs.coverage.result }}"
          exit 1

      - name: Require Sonar credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if test -z "$SONAR_TOKEN"; then
            echo "::error::SONAR_TOKEN is required. Fork PRs need a maintainer-reviewed branch in this repository for the Sonar check."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Go coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-go

      - name: Download web coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-web-*
          path: web/coverage

      - name: Require complete coverage reports
        run: |
          test -s coverage.out
          test -s web/coverage/coverage-web-unit/lcov.info
          test -s web/coverage/coverage-web-dom-1/lcov.info
          test -s web/coverage/coverage-web-dom-2/lcov.info

      - name: Run SonarCloud scan and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.javascript.lcov.reportPaths=web/coverage/coverage-web-unit/lcov.info,web/coverage/coverage-web-dom-1/lcov.info,web/coverage/coverage-web-dom-2/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Static binaries for the distro matrix. Also the module and whole-tree build check.
  build-artifacts:
    name: build static binaries
    if: github.ref_type != 'tag'
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist

      - name: Verify modules and build
        run: |
          go mod verify
          go build ./...

      - name: Build uam and web test binaries (static)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -o dist/uam ./cmd/uam
          go test -c -o dist/cli.test ./internal/cli/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distro-binaries
          path: dist/
          retention-days: 1

  # The same static binary and authenticated web lifecycle tests on every
  # supported Linux distro. Tests use disposable runtime/config directories.
  distros:
    name: ${{ matrix.name }}
    needs: build-artifacts
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu, image: "ubuntu:24.04" }
          - { name: debian, image: "debian:12" }
          - { name: arch, image: "archlinux:latest" }
          - { name: ubi8, image: "redhat/ubi8:latest" }
          # rockylinux:9 is the bug-for-bug RHEL 9 stand-in Red Hat does not
          # publish a freely pullable image for.
          - { name: rhel9-rocky, image: "rockylinux:9" }
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distro-binaries
          path: dist

      - name: Smoke uam on this distro
        shell: sh
        run: |
          set -eu
          chmod +x dist/uam dist/cli.test
          mkdir -p tmp/cfg tmp/run tmp/cache
          UAM_CONFIG_DIR="$PWD/tmp/cfg" UAM_SESSION_DIR="$PWD/tmp/run" UAM_CACHE_DIR="$PWD/tmp/cache" \
            ./dist/uam web status --json
          UAM_CONFIG_DIR="$PWD/tmp/cfg" UAM_SESSION_DIR="$PWD/tmp/run" UAM_CACHE_DIR="$PWD/tmp/cache" \
            ./dist/uam help

      - name: Authenticated web lifecycle and CLI tests
        shell: sh
        run: |
          set -eu
          UAM_WEB_TEST_BIN="$PWD/dist/uam" ./dist/cli.test -test.v

  snapshot:
    name: GoReleaser snapshot
    if: github.ref_type != 'tag'
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist

      # The release scripts are rehearsed when release tooling changes, and on
      # the weekly schedule, manual runs and release fallbacks.
      - name: Detect release tooling changes
        id: tooling
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          changed=true
          if { test "$EVENT" = pull_request || test "$EVENT" = push; } && test -n "$BASE" && files=$(git diff --name-only "$BASE" HEAD); then
            grep -qE '^(scripts/|Makefile$|\.goreleaser\.yml$|go\.(mod|sum)$|\.github/workflows/|web/(package|package-lock)\.json$|web/\.node-version$|internal/version/)' <<< "$files" || changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Release tooling changed: $changed"

      - name: Set up Node
        if: steps.tooling.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.node-version
          package-manager-cache: false

      - name: Verify source and release-tag packaging
        if: steps.tooling.outputs.changed == 'true'
        run: scripts/test-release-packaging

      - name: Verify source build versions
        if: steps.tooling.outputs.changed == 'true'
        run: scripts/test-version

      - name: Install Cosign
        if: steps.tooling.outputs.changed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Verify Cosign release contract
        if: steps.tooling.outputs.changed == 'true'
        run: |
          cosign version
          cosign sign-blob --help | grep -F -- "--output-signature"
          cosign sign-blob --help | grep -F -- "--output-certificate"

      - name: Validate GoReleaser configuration
        if: steps.tooling.outputs.changed == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check

      # --skip=before: the snapshot embeds the shared bundle instead of rebuilding it.
      - name: Build snapshot archives
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean --skip=before,sign,sbom

      - name: Verify archive names and contents
        shell: bash
        run: |
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name 'uam_*.tar.gz' -print | sort)
          test "${#archives[@]}" -eq 4
          for archive in "${archives[@]}"; do
            basename "${archive}" | grep -Eq '^uam_.+_(linux|darwin)_(amd64|arm64)\.tar\.gz$'
            tar -tzf "${archive}" | grep -Eq '(^|/)uam$'
          done
          linux_archive="$(find dist -maxdepth 1 -type f -name 'uam_*_linux_amd64.tar.gz' -print -quit)"
          test -n "${linux_archive}"
          mkdir -p /tmp/uam-release-smoke
          tar -xzf "${linux_archive}" -C /tmp/uam-release-smoke
          binary="$(find /tmp/uam-release-smoke -type f -name uam -print -quit)"
          test -n "${binary}"
          "${binary}" version | grep -E '.+'

  darwin-native:
    name: Darwin-native lifecycle and version smoke
    if: github.ref_type != 'tag'
    needs: web
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-assets
          path: internal/web/dist

      - name: Run web runtime and lifecycle tests
        run: go test -race -count=1 -timeout=4m ./internal/daemonruntime ./internal/cli ./internal/web -run 'Test(Web|Main|RunDefaults|OnlyCopilot|TerminalCommands|Acceptance.*(Daemon|Spawn)|VerifyDir|EnsureDir|DefaultDir|ProcStartTime)'

      - name: Build and run version command
        run: |
          go build -o "${RUNNER_TEMP}/uam" ./cmd/uam
          "${RUNNER_TEMP}/uam" version | grep -E '.+'

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1
          gosec -exclude-dir=.claude -exclude-dir=vendor ./...

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
