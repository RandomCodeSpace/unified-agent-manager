name: Scheduled fuzzing

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/displaytext
            target: FuzzSanitize
          - package: ./internal/web
            target: FuzzEventSocketTarget
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz for 30 seconds
        run: go test "${{ matrix.package }}" -run=^$ -fuzz="^${{ matrix.target }}$" -fuzztime=30s
