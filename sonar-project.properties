sonar.projectKey=RandomCodeSpace_unified-agent-manager
sonar.organization=randomcodespace
sonar.projectName=unified-agent-manager
sonar.host.url=https://sonarcloud.io
sonar.qualitygate.wait=true

sonar.sources=.
sonar.exclusions=bin/**,vendor/**,.git/**,.github/**,.claude/**,**/*_test.go,web/tests/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,web/tests/**
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
# Development-only code: the in-browser API mock (dropped from production
# builds) and repository tooling scripts.
sonar.coverage.exclusions=web/src/mock/**,scripts/**
sonar.sourceEncoding=UTF-8
