sonar.projectKey=RandomCodeSpace_unified-agent-manager
sonar.organization=randomcodespace
sonar.projectName=unified-agent-manager
sonar.host.url=https://sonarcloud.io
sonar.qualitygate.wait=true

sonar.sources=.
# web/src/mock is the development-only in-browser API mock: main.tsx loads it
# behind import.meta.env.DEV, so production builds do not contain it.
sonar.exclusions=bin/**,vendor/**,.git/**,.github/**,.claude/**,**/*_test.go,web/tests/**,web/src/mock/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,web/tests/**
sonar.go.coverage.reportPaths=coverage.out
# node --test (web/tests/*.test.mjs) and vitest (web/tests/dom, the components).
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,web/coverage/dom/lcov.info
# Build and test-runner configuration, and repository tooling scripts.
sonar.coverage.exclusions=web/vite.config.ts,web/vitest.config.ts,scripts/**
sonar.sourceEncoding=UTF-8
