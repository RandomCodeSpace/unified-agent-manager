sonar.projectKey=RandomCodeSpace_unified-agent-manager
sonar.organization=randomcodespace
sonar.projectName=unified-agent-manager
sonar.host.url=https://sonarcloud.io
sonar.qualitygate.wait=true

sonar.sources=.
# Test code is not analysed: tests, fixtures, the agenttest fake (imported only
# by tests) and the vitest configuration. web/packages/ui/src/mock is the development-only
# in-browser API mock: main.tsx loads it behind import.meta.env.DEV, so
# production builds do not contain it.
sonar.exclusions=bin/**,vendor/**,.git/**,.github/**,.claude/**,**/*_test.go,**/testdata/**,internal/agentapi/agenttest/**,web/packages/ui/tests/**,web/vitest.config.ts,web/packages/ui/src/mock/**
sonar.go.coverage.reportPaths=coverage.out
# node --test (web/packages/ui/tests/*.test.mjs) and vitest (web/packages/ui/tests/dom, the components).
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,web/coverage/dom/lcov.info
# Build configuration and repository tooling scripts.
sonar.coverage.exclusions=web/vite.config.ts,scripts/**
sonar.sourceEncoding=UTF-8
