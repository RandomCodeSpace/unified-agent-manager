version: "2"

run:
  timeout: 3m

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    - misspell
  exclusions:
    rules:
      # Copilot CLI 1.0.93 still sends tool.execution_partial_result. Moving
      # live shell output to tool.shell_output removes this exclusion.
      - linters: [staticcheck]
        text: "SA1019: rpc.ToolExecutionPartialResultData"

formatters:
  enable:
    - gofmt
    - goimports
